services:
  radiofloorcontroller:
    image: radiofloorcontroller
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=radiofloorcontroller;Username=postgres;Password=postgres
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: radiofloorcontroller
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d radiofloorcontroller"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
